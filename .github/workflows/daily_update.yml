name: Daily Wealth Dashboard Update

on:
  schedule:
    # 8:30 AM IST (03:00 UTC) and 4:30 PM IST (11:00 UTC), Mon-Fri
    - cron: '0 3 * * 1-5'
    - cron: '0 11 * * 1-5'
  workflow_dispatch: # Allows manual 1-click test runs anytime

permissions:
  contents: write

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch market data & RSS news
        run: python fetch_data.py

      - name: Run AI Strategist & News Verification
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_analyst.py

      - name: Send Email & WhatsApp Digests
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_API_KEY: ${{ secrets.CALLMEBOT_API_KEY }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: python notifier.py

      - name: Commit & push updated snapshot
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Wealth Dashboard Bot"
          git add data/market_snapshot.json
          git diff --staged --quiet || git commit -m "Auto-update market snapshot"
          git push
